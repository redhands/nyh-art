<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>어디론가 흘러가는 중.🌙 | NYH's Artworks</title>
    <meta
      name="description"
      content="NYH's Artworks의 전체 작품 아카이브를 폴더별 시리즈 단위로 감상할 수 있는 갤러리 페이지"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="index.html">
          <img
            class="brand-mark"
            src="assets/profile.jpg"
            alt="NYH 프로필 이미지"
          />
          <span class="brand-text">
            <strong>NYH's Artworks</strong>
            <small>온라인 갤러리</small>
          </span>
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          메뉴
        </button>

        <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a href="gallery.html">갤러리</a>
          <a href="index.html#about">작가 소개</a>
          <a href="index.html#notes">작품 세계</a>
          <a href="https://www.instagram.com/nyh_doodles" target="_blank" rel="noreferrer">인스타그램</a>
        </nav>
      </header>

      <main class="gallery-page-main">
        <section class="page-hero reveal">
          <p class="eyebrow">전체 아카이브</p>
          <h1>어디론가 흘러가는 중.🌙</h1>
          <p id="gallery-summary" class="page-hero-body">
            바다를 지나 해파리와 돌고래를 만나고, 다시 별빛을 향해 흘러가는
            장면들을 시리즈별로 모아둔 아카이브입니다.
          </p>

          <div class="gallery-toolbar">
            <span class="pill" id="gallery-count">총 0점</span>
            <span class="pill" id="gallery-groups">총 0개 시리즈</span>
            <span class="pill">폴더별 아카이브</span>
            <span class="pill">작품 정보 분리 관리</span>
          </div>
        </section>

        <section class="section gallery-section gallery-section-page" aria-labelledby="gallery-groups-title">
          <div class="section-heading reveal">
            <p class="eyebrow">시리즈</p>
            <h2 id="gallery-groups-title">전체 시리즈 보기</h2>
          </div>

          <div class="series-filter reveal" id="series-filter"></div>
          <div class="gallery-groups" id="gallery-groups-container"></div>
        </section>
      </main>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="작품 확대 보기">
      <button class="lightbox-close" type="button" aria-label="닫기">닫기</button>
      <div class="lightbox-content">
        <img id="lightbox-image" alt="" />
        <div class="lightbox-meta">
          <p id="lightbox-index"></p>
          <h3 id="lightbox-title"></h3>
          <p id="lightbox-description"></p>
        </div>
      </div>
    </div>

    <script src="data/gallery-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
